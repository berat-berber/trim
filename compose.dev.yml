services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db 
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  write-service:
    build: ./services/writeService
    environment:
      db: Host=database;Database=db;Username=postgres;Password=postgres
    depends_on:
      database:
        condition: service_healthy

  read-service:
    build: ./services/readService
    environment:
      db: Host=database;Database=db;Username=postgres;Password=postgres
    depends_on:
      database:
        condition: service_healthy

  reverse-proxy:
    build:
      context: .
      dockerfile: reverse-proxy/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost}
    ports:
      - "80:80"
    depends_on:
      - write-service
      - read-service

volumes:
  pgdata:
